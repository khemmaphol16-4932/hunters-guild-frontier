<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b2432" />
<title>Hunter's Guild: Frontier — Tycoon</title>
<style>
:root{
  --bg:#10151f; --bg2:#161d2b; --panel:#1c2536; --panel2:#232e42; --line:#2e3a52;
  --ink:#e8eef7; --muted:#93a1ba; --dim:#66748f;
  --gold:#f2c14e; --gem:#5fd0e0; --hp:#e05a5a; --xp:#7fd06a; --energy:#f0a850; --mood:#c98be0;
  --accent:#4f8ff0; --accent2:#8b6df0; --good:#54c98a; --bad:#e0574f;
  --c-common:#8c98a8; --c-refined:#dde3ea; --c-rare:#5b8dd6; --c-epic:#b58bd6; --c-ancient:#d9a441; --c-legendary:#d4685f;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
:root[data-theme="light"]{
  --bg:#eef1f6; --bg2:#e4e9f1; --panel:#ffffff; --panel2:#f2f5fa; --line:#d3dae6;
  --ink:#1a2231; --muted:#5a6883; --dim:#8592ab;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
  font-size:14px; line-height:1.4; user-select:none; -webkit-user-select:none;
  display:flex; flex-direction:column; height:100dvh;
}
#app{display:flex;flex-direction:column;height:100%;width:100%;margin:0 auto;position:relative;background:var(--bg)}

/* ---------- Top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:6px;padding:calc(6px + var(--safe-t)) 10px 6px;
  background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line);
  flex:0 0 auto;z-index:20;
}
.res{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:3px 9px 3px 6px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.res .ic{font-size:14px}
.res.gold{color:var(--gold)} .res.gem{color:var(--gem)}
#topbar .spacer{flex:1}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
.daychip{font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 8px}

/* ---------- Main ---------- */
#main{flex:1 1 auto;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.view.active{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 10px 14px;flex:1;width:100%;max-width:860px;margin:0 auto}
.view-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:2px 2px 8px}

/* town canvas */
#townWrap{position:absolute;inset:0}
#town{width:100%;height:100%;display:block;touch-action:none}
#townHud{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(8px);
  display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#townHud .pill{pointer-events:auto}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.28)}
.pill .sub{color:var(--muted);font-weight:500}
#buildToast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);
  border-radius:12px;padding:8px 14px;font-size:12.5px;font-weight:600;display:none;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#worldLog{position:absolute;left:8px;bottom:64px;max-width:70%;font-size:10.5px;line-height:1.5;color:var(--muted);
  pointer-events:none;z-index:4;text-shadow:0 1px 2px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
#worldLog div{opacity:.9}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.row+.row{margin-top:8px}
.grow{flex:1;min-width:0}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(180deg,#f6cf6a,#e0ab34);color:#3a2c05}
.btn.good{background:var(--good);color:#062a17}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.4;pointer-events:none}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .3s}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.gridlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* hunter chip */
.hchip{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;margin-bottom:8px}
.avatar{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;position:relative;border:1px solid rgba(255,255,255,.12);overflow:hidden}
.avatar .lv{position:absolute;bottom:-4px;right:-4px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:9px;font-weight:800;padding:1px 4px;color:var(--ink)}
.state-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}

/* gear */
.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gslot{aspect-ratio:1;border:1.5px solid var(--line);border-radius:12px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;overflow:hidden}
.gslot .ic{font-size:22px}
.gslot .plus{color:var(--dim);font-size:20px}
.gslot .enh{position:absolute;top:3px;right:5px;font-size:10px;font-weight:800;color:var(--gold)}
.gslot .slotname{font-size:9px;color:var(--dim);position:absolute;bottom:3px}
.gitem{display:flex;gap:10px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:7px;cursor:pointer}
.gicon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;border:1px solid var(--line)}

/* field */
.fieldcard{position:relative;overflow:hidden}
.fieldcard .lock{position:absolute;inset:0;background:rgba(10,14,22,.72);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--muted);font-weight:700}

/* combat overlay */
#combat{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:40}
#combatCanvasWrap{flex:1;position:relative;min-height:0}
#combatCv{width:100%;height:100%;display:block}
#combatTop{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 10px 8px;border-bottom:1px solid var(--line);background:var(--bg2)}
#combatLog{height:96px;overflow-y:auto;padding:6px 10px;font-size:11.5px;background:var(--bg2);border-top:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
#combatLog div{padding:1px 0}

/* modal / sheet */
#sheet{position:absolute;inset:0;z-index:50;display:none}
#sheet .backdrop{position:absolute;inset:0;background:rgba(4,7,12,.6)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;max-width:680px;margin:0 auto;background:var(--panel);border-radius:18px 18px 0 0;
  border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
#sheet.center .panel{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-50%);border-radius:16px;width:calc(100% - 30px);max-width:420px;max-height:82%}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.sheet-head h2{margin:0;font-size:16px;flex:1}
.sheet-body{overflow-y:auto;padding:0 14px 16px;-webkit-overflow-scrolling:touch}
.close{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;width:30px;height:30px;font-size:16px;cursor:pointer}

/* bottom nav */
#nav{display:flex;flex:0 0 auto;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#nav button{flex:1;background:none;border:none;color:var(--dim);padding:8px 2px 7px;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
#nav button .ic{font-size:20px;line-height:1}
#nav button.on{color:var(--accent)}
#nav button .badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:20px;font-size:9px;font-weight:800;padding:0 5px;min-width:15px;text-align:center}

/* floaty */
.chipline{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.statmini{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 7px}
.divider{height:1px;background:var(--line);margin:12px 0}
.center{text-align:center}
.flash{animation:flash .5s}
@keyframes flash{0%{background:var(--accent)}100%{}}
.toastup{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--good);
  color:var(--ink);border-radius:12px;padding:9px 16px;font-weight:700;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .3s, transform .3s}
.toastup.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="res gold"><span class="ic">🪙</span><span id="uiGold" class="num">0</span></div>
    <div class="res gem" id="gemChip" style="cursor:pointer"><span class="ic">💎</span><span id="uiGem" class="num">0</span></div>
    <div class="spacer"></div>
    <div class="daychip">Day <span id="uiDay">1</span></div>
    <button class="iconbtn" id="btnQuests" style="position:relative">🎯<span class="badge" id="questBadge" style="display:none;position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:20px;font-size:9px;font-weight:800;padding:0 4px;min-width:14px;text-align:center"></span></button>
    <button class="iconbtn" id="btnFull" title="เต็มจอ">⛶</button>
    <button class="iconbtn" id="btnSettings">⚙</button>
  </div>

  <div id="main">
    <!-- WORLD (seamless: town + wilds on one canvas) -->
    <div class="view active" id="view-town">
      <div id="townWrap">
        <canvas id="town"></canvas>
        <div id="buildToast"></div>
        <div id="townHud">
          <div class="pill" id="pillPop">👥 <span id="hudPop">0</span> <span class="sub">ชาวเมือง</span></div>
          <div class="pill" id="pillIncome">📈 <span id="hudIncome">0</span>/นาที</div>
          <div class="pill" id="pillBuild">🏗️ สร้าง/อัพเกรด</div>
          <div class="pill" id="pillHome">🏠 เมือง</div>
        </div>
      </div>
    </div>

    <!-- HUNTERS -->
    <div class="view" id="view-hunters">
      <div class="scroll">
        <div class="view-title">นักล่า</div>
        <div id="huntersList"></div>
        <div class="card" id="recruitCard"></div>
      </div>
    </div>

    <!-- GEAR -->
    <div class="view" id="view-gear">
      <div class="scroll">
        <div class="view-title">คลังอุปกรณ์</div>
        <div id="gearTop"></div>
        <div id="inventoryWrap"></div>
      </div>
    </div>

    <!-- SHOP / TYCOON -->
    <div class="view" id="view-shop">
      <div class="scroll">
        <div class="view-title">เมือง & ธุรกิจ</div>
        <div id="shopList"></div>
      </div>
    </div>

    <div id="worldLog"></div>
    <div id="toastup" class="toastup"></div>
  </div>

  <!-- bottom sheet -->
  <div id="sheet"><div class="backdrop"></div><div class="panel">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="close" id="sheetClose">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div></div>

  <nav id="nav">
    <button data-view="town" class="on"><span class="ic">🌍</span>โลก</button>
    <button data-view="hunters"><span class="ic">🛡️</span>นักล่า<span class="badge" id="navBadgeH" style="display:none"></span></button>
    <button data-view="gear"><span class="ic">⚔️</span>อุปกรณ์<span class="badge" id="navBadgeG" style="display:none"></span></button>
    <button data-view="shop"><span class="ic">🏗️</span>ธุรกิจ</button>
  </nav>
</div>

<script>
"use strict";
/* =========================================================================
   Hunter's Guild: Frontier — Tycoon Edition
   Single-file, offline, mobile-first. localStorage save + offline catch-up.
   Rebuilt in the Evil Hunter Tycoon direction from the HGF world/data.
   ========================================================================= */

const SAVE_KEY = "hgf-eht-v1";
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rnd = (a,b)=>a+Math.random()*(b-a);
const ri  = (a,b)=>Math.floor(rnd(a,b+1));
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
const now = ()=>Date.now();
function fmt(n){ n=Math.floor(n);
  if(n>=1e9) return (n/1e9).toFixed(2)+"B";
  if(n>=1e6) return (n/1e6).toFixed(2)+"M";
  if(n>=1e4) return (n/1e3).toFixed(1)+"k";
  return n.toLocaleString("en-US"); }

/* -------------------- Art assets (repo pixel art; emoji fallback) --------------------
   Uses the project's QA-cleaned sprites under art/qa/. Paths are relative to this
   file at the repo root. If an image fails to load (e.g. opened without the folder),
   every draw path falls back to the emoji it replaced, so the game still runs. */
const ART_BASE = "art/qa/";
const ART_SRC = {
  hunter_vanguard: "proof-cycle-rigs-source-v2/hunter_vanguard_skel_idle_se_02@2x.png",
  hunter_ranger:   "proof-cycle-rigs-source-v2/hunter_ranger_skel_idle_se_02@2x.png",
  hunter_adept:    "proof-cycle-rigs-source-v2/hunter_adept_skel_idle_se_02@2x.png",
  moss_crawler:    "proof-cycle-actors-source-v1/monster_moss_crawler_idle_se_01@2x.png",
  thicket_wasp:    "thicket-wasp-source-v1/monster_thicket_wasp_idle_se_01@2x.png",
  thicket_wasp_2:  "thicket-wasp-source-v1/monster_thicket_wasp_idle_se_02@2x.png",
  thicket_wasp_3:  "thicket-wasp-source-v1/monster_thicket_wasp_idle_se_03@2x.png",
  thicket_wasp_4:  "thicket-wasp-source-v1/monster_thicket_wasp_idle_se_04@2x.png",
  firepit:         "town-props-source-v2/prp_town_basic_firepit_01@2x.png",
  woodpile:        "town-props-source-v2/prp_town_basic_woodpile_01@2x.png",
  weapon_rack:     "town-props-source-v2/prp_town_basic_weapon_rack_01@2x.png",
  handcart:        "town-props-source-v2/prp_town_basic_handcart_01@2x.png",
  bench:           "town-props-source-v2/prp_town_basic_bench_01@2x.png",
  tree_conifer:    "trees-source-v1/prp_trees_conifer_medium_01@2x.png",
  tree_broadleaf:  "trees-source-v1/prp_trees_broadleaf_medium_01@2x.png",
  tree_birch:      "trees-source-v1/prp_trees_birch_medium_01@2x.png",
};
// Idle animation frame lists (monster id -> art keys). Falls back to the single sprite.
const ART_ANIM = { thicket_wasp: ["thicket_wasp","thicket_wasp_2","thicket_wasp_3","thicket_wasp_4"] };
const ANIM_FPS = 6;
function animImg(mid){
  const frames=ART_ANIM[mid];
  if(frames){ const ready=frames.filter(artReady); if(ready.length){ const i=Math.floor(performance.now()/1000*ANIM_FPS)%ready.length; return IMG[ready[i]]; } }
  return artReady(mid)?IMG[mid]:null;
}
const IMG = {};           // key -> HTMLImageElement (may be not-yet-loaded)
const _tintCache = {};    // key|color -> canvas
function loadArt(){
  for(const k in ART_SRC){ const im=new Image(); im.decoding="async"; im.src=ART_BASE+ART_SRC[k]; IMG[k]=im; }
}
function artReady(k){ const im=IMG[k]; return im && im.complete && im.naturalWidth>0; }
function tintedSprite(key, color, alpha){
  const im=IMG[key]; if(!artReady(key)) return null;
  const ck=key+"|"+color; if(_tintCache[ck]) return _tintCache[ck];
  const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight;
  const x=c.getContext("2d"); x.imageSmoothingEnabled=false;
  x.drawImage(im,0,0);
  x.globalCompositeOperation="source-atop"; x.globalAlpha=alpha==null?0.5:alpha;
  x.fillStyle=color; x.fillRect(0,0,c.width,c.height);
  x.globalAlpha=1; x.globalCompositeOperation="source-over";
  _tintCache[ck]=c; return c;
}
const _avatarURL={};
function hunterAvatarURL(cls){
  const c=CLASSES[cls]; const ck=cls;
  if(_avatarURL[ck]!==undefined) return _avatarURL[ck];
  const art=tintedSprite(c.sprite, c.tint, 0.5);
  _avatarURL[ck] = art ? art.toDataURL() : null;
  return _avatarURL[ck];
}
function avatarInner(cls, lv){
  const c=CLASSES[cls]; const url=hunterAvatarURL(cls);
  const body = url
    ? `<img src="${url}" alt="" style="position:absolute;left:50%;top:14%;transform:translateX(-50%);height:150%;image-rendering:pixelated;pointer-events:none">`
    : c.emoji;
  return `${body}${lv!=null?`<span class="lv">Lv${lv}</span>`:""}`;
}
// draw an image/canvas anchored feet-at-(cx,groundY); pad = fraction of art below the feet
function drawSpriteB(ctx, art, cx, groundY, targetH, pad){
  if(!art) return false;
  const w0=art.naturalWidth||art.width, h0=art.naturalHeight||art.height; if(!w0) return false;
  const h=targetH, w=h*(w0/h0);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(art, cx-w/2, groundY - h + h*(pad||0), w, h);
  return true;
}

/* -------------------- Static content (from HGF world data) -------------------- */
const CLASSES = {
  vanguard:{name:"Vanguard", th:"แนวหน้า", role:"tank",  emoji:"🛡️", col:"#c98b5a", sprite:"hunter_vanguard", tint:"#b56a3a",
            base:{hp:340, atk:22, def:18, spd:2.0, crit:.04}, grow:{hp:46, atk:3.2, def:2.6}},
  reaver:  {name:"Reaver",   th:"นักบุก",  role:"melee", emoji:"⚔️", col:"#d05a5a", sprite:"hunter_vanguard", tint:"#c23b3b",
            base:{hp:230, atk:38, def:9,  spd:1.6, crit:.10}, grow:{hp:30, atk:5.6, def:1.2}},
  ranger:  {name:"Ranger",   th:"นักแม่น", role:"ranged",emoji:"🏹", col:"#7fc06a", sprite:"hunter_ranger", tint:"#3f9e4f",
            base:{hp:190, atk:34, def:7,  spd:1.5, crit:.14}, grow:{hp:26, atk:5.2, def:1.0}},
  adept:   {name:"Adept",    th:"ผู้เวท",  role:"mage",  emoji:"✨", col:"#8b8bf0", sprite:"hunter_adept", tint:"#6a5fd0",
            base:{hp:180, atk:40, def:6,  spd:2.2, crit:.08}, grow:{hp:24, atk:6.0, def:0.9}},
};
const CLASS_IDS = Object.keys(CLASSES);
// Active class skills — auto-fire on cooldown during a hunt.
const SKILLS = {
  vanguard:{name:"Rallying Guard", th:"ปกป้องหมู่", cd:12, kind:"heal", pow:0.09, col:"#54c98a",
            desc:"ฟื้น HP ทั้งปาร์ตี้ 9% ทุก 12 วิ"},
  reaver:  {name:"Cleave", th:"ฟันวงกว้าง", cd:8, kind:"aoe", pow:1.7, col:"#e0574f",
            desc:"ฟันศัตรูทุกตัว 170% โจมตี ทุก 8 วิ"},

/* -------------------- Hunter stats -------------------- */
function gearStat(item, key){ // resolve one item's contribution to a base stat key
  if(!item) return {flat:0,pct:0};
  let flat=0,pct=0;
  const slot=slotById(item.slot);
  const r=rarById(item.rarity);
  // main stat
  if(slot.main===key){ flat += Math.round(item.mainBase * r.mult * (1+item.enh*0.12)); }
  for(const s of item.subs){
    const def=SUBS.find(x=>x.id===s.id); if(!def) continue;
    if(def.kind==="flat" && def.id===key) flat += s.v;
    else if(def.kind==="pct" && def.stat===key) pct += s.v;
  }
  return {flat,pct};
}
function hunterStats(h){
  const c=CLASSES[h.cls], g=c.grow, L=h.lv-1;
  let hp=c.base.hp+g.hp*L, atk=c.base.atk+g.atk*L, def=c.base.def+g.def*L;
  let spd=c.base.spd, crit=c.base.crit, cd=1.5, spdpct=0;
  let hpP=0,atkP=0;
  // gear
  const setCount={};
  for(const slot of SLOTS){
    const it=h.eq[slot.id]; if(!it) continue;
    if(it.set){ setCount[it.set]=(setCount[it.set]||0)+1; }
    const a=gearStat(it,"atk"); atk+=a.flat; atkP+=a.pct;
    const hh=gearStat(it,"hp"); hp+=hh.flat; hpP+=hh.pct;
    const d=gearStat(it,"def"); def+=d.flat;
    // special subs
    for(const s of it.subs){
      const dfn=SUBS.find(x=>x.id===s.id); if(!dfn) continue;
      if(dfn.kind==="critpct") crit+=s.v/100;
      else if(dfn.kind==="cdpct") cd+=s.v/100;
      else if(dfn.kind==="spdpct") spdpct+=s.v;
    }
    // main crit/spd
    if(slot.main==="crit"){ const r=rarById(it.rarity); crit += (it.mainBase*r.mult*(1+it.enh*0.12))/100; }
    if(slot.main==="spd"){ const r=rarById(it.rarity); spdpct += (it.mainBase*r.mult*(1+it.enh*0.12)); }
  }
  // set bonuses
  for(const sid in setCount){
    const st=SETS[sid], n=setCount[sid]; if(!st) continue;
    if(n>=2 && st.b2){ if(st.b2.def)def*=1+st.b2.def; if(st.b2.crit)crit+=st.b2.crit; if(st.b2.spd)spdpct+=st.b2.spd*100; }
    if(n>=4 && st.b4){ if(st.b4.hp)hpP+=st.b4.hp*100; if(st.b4.atk)atkP+=st.b4.atk*100; if(st.b4.crit)crit+=st.b4.crit; }
  }
  hp*=1+hpP/100; atk*=1+atkP/100; spd/=1+spdpct/100;
  const sm=1+(h.star||0)*0.12; hp*=sm; atk*=sm; def*=sm;   // ascension bonus
  return {
    hp:Math.round(hp), atk:Math.round(atk), def:Math.round(def),
    spd:Math.max(0.5,spd), crit:clamp(crit,0,0.75), cd, ranged:c.role==="ranged"||c.role==="mage",
  };
}
function hunterMaxHp(h){ return hunterStats(h).hp; }
function hunterPower(h){ const s=hunterStats(h); return Math.round(s.hp*0.25 + s.atk*(1+s.crit*(s.cd-1))/s.spd*3 + s.def*2); }
function xpToNext(lv){ return Math.floor(BAL.xpBase*Math.pow(BAL.xpStep,lv-1)); }
function giveXp(h, amt){
  const cap=capForStar(h.star||0);
  h.xp+=amt;
  while(h.lv<cap && h.xp>=xpToNext(h.lv)){ h.xp-=xpToNext(h.lv); h.lv++; h.hp=hunterMaxHp(h); }
  if(h.lv>=cap) h.xp=Math.min(h.xp, xpToNext(h.lv)); // hold at cap until ascended
}
/* ---- Ascension (EHT-style star / grade) ---- */
const GRADES=["E","D","C","B","A","S"];
function gradeOf(h){ return GRADES[Math.min(h.star||0,5)]; }
function capForStar(star){ return 20 + (star||0)*20; }
function ascendCost(h){ const s=h.star||0; return {gold:Math.round(3000*Math.pow(3.2,s)), gems:5+s*5}; }
function atCap(h){ return h.lv>=capForStar(h.star||0); }
function canAscend(h){ return (h.star||0)<5 && atCap(h); }
function ascend(h){ if(!canAscend(h)) return false; const c=ascendCost(h);
  if(S.gold<c.gold || S.gems<c.gems) return false;
  S.gold-=c.gold; S.gems-=c.gems; h.star=(h.star||0)+1; h.hp=hunterMaxHp(h);
  refreshTopbar(); queueSave(); return true; }

/* -------------------- Gear generation -------------------- */
function rollRarity(luck=0){
  let tot=0; const ws=RARITY.map(r=>{ let w=r.w*(1+ (RARITY.indexOf(r)>=2?luck:0)); tot+=w; return w; });
  let x=Math.random()*tot;
  for(let i=0;i<RARITY.length;i++){ x-=ws[i]; if(x<=0) return RARITY[i]; }
  return RARITY[0];
}
function makeItem(ilvl, forceRar){
  const r = forceRar ? rarById(forceRar) : rollRarity(ilvl>15?0.15:0);
  const slot = pick(SLOTS);
  const mainBaseByStat = {atk:10,hp:60,def:8,spd:12,crit:10};
  const item = {
    id:"i"+Math.random().toString(36).slice(2,9),
    slot:slot.id, rarity:r.id, ilvl,
    mainBase: Math.round((mainBaseByStat[slot.main]) * (1 + ilvl*0.11) * rnd(0.9,1.1)),
    enh:0, subs:[], set:null,
  };
  // subs
  const pool = SUBS.filter(s=> !(s.kind==="flat"&&s.id===slot.main) );
  const chosen=[];
  for(let i=0;i<r.subs && pool.length;i++){
    const s=pick(pool.filter(p=>!chosen.includes(p.id)));
    if(!s) break; chosen.push(s.id);
    let v=ri(s.rng[0],s.rng[1]); if(s.kind==="flat") v=Math.round(v*(1+ilvl*0.08));
    item.subs.push({id:s.id, v});
  }
  // set (rare+)
  if(RARITY.indexOf(r)>=2 && Math.random()<0.5) item.set=pick(SET_IDS);
  return item;
}
function itemPower(it){
  const s=slotById(it.slot), r=rarById(it.rarity);
  let p=it.mainBase*r.mult*(1+it.enh*0.12)* (s.main==="hp"?0.25:s.main==="def"?2: s.main==="spd"?4: s.main==="crit"?6:2);
  for(const sub of it.subs){ const d=SUBS.find(x=>x.id===sub.id); if(d&&d.kind==="flat") p+= sub.v*(sub.id==="hp"?0.25:sub.id==="def"?2:2); else p+=sub.v*3; }
  return Math.round(p);
}
function enhanceCost(it){ return Math.floor(40*Math.pow(1.55,it.enh)*(1+it.ilvl*0.15)); }

/* -------------------- Persistence -------------------- */
let saveTimer=0;
function save(){ try{ S.last=now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,800); }
function load(){
  try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
    S=JSON.parse(raw); if(!S||!S.hunters) return false;
    // ensure fields exist
    S.buildings=S.buildings||{}; for(const b in BUILDINGS){ if(!S.buildings[b]) S.buildings[b]={lv:b==="guild_hall"?1:0}; }
    S.settings=S.settings||{lang:"th",theme:"dark",speed:1};
    if(S.bonusCap==null) S.bonusCap=0; if(!S.quests) S.quests={};
    if(!S.stats) S.stats={kills:0,bossKills:0,goldEarned:0,dropsL:0,sold:0};
    if(S.stats.sold==null) S.stats.sold=0;
    // migrate hunters to seamless-world agents
    for(const h of S.hunters){
      if(h.star==null) h.star=0;
      if(h.ai==null){ h.ai="TOWN_IDLE"; h.aiT=0; h.facing=1;
        h.wx=TOWN_X+rnd(-5,5); h.wy=rnd(-2.5,2.5); h.gx=TOWN_X; h.gy=0; h.dest=null;
        h.assignedZone= h.field||"auto"; h.bag={gold:0,items:[]}; h._skcd=null; }
      if(!h.bag) h.bag={gold:0,items:[]};
      h.hp=Math.max(1,h.hp||1); h.energy=h.energy==null?BAL.energyMax:h.energy;
    }
    S.world={mobs:[],bossT:{}};
    layoutTown(); return true;
  }catch(e){ return false; }
}

function isoY(r,c){ return (c+r)*(TILE*0.5); }
function buildingAtCenter(){ // list of centers hunters can visit (tile coords)
  return townPlaced.map(p=>({b:p.b, r:p.r+0.5, c:p.c+0.5}));
}

let townCv, tctx;

  townCv=$("#town"); tctx=townCv.getContext("2d");
  resizeTown();
  let dragging=false,lx=0,ly=0,moved=0;
  const start=(x,y)=>{dragging=true;lx=x;ly=y;moved=0;};
  const move=(x,y)=>{ if(!dragging)return; camX+=(x-lx);camY+=(y-ly); moved+=Math.abs(x-lx)+Math.abs(y-ly); lx=x;ly=y; };
  const end=(x,y)=>{ if(dragging && moved<8){ townTap(x,y); } dragging=false; };
  townCv.addEventListener("touchstart",e=>{const t=e.touches[0];start(t.clientX,t.clientY);},{passive:true});
  townCv.addEventListener("touchmove",e=>{const t=e.touches[0];move(t.clientX,t.clientY);},{passive:true});
  townCv.addEventListener("touchend",e=>{const t=e.changedTouches[0];end(t.clientX,t.clientY);});
  townCv.addEventListener("mousedown",e=>start(e.clientX,e.clientY));

}

function roundRectPath(x,y,w,h,r){ tctx.beginPath(); tctx.moveTo(x+r,y); tctx.arcTo(x+w,y,x+w,y+h,r); tctx.arcTo(x+w,y+h,x,y+h,r); tctx.arcTo(x,y+h,x,y,r); tctx.arcTo(x,y,x+w,y,r); tctx.closePath(); }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255); return `rgb(${r},${g},${b})`; }

// wandering townsfolk (cosmetic)
let folk=[];
function ensureFolk(){
  const target=Math.min(18, S.town.pop);
  while(folk.length<target) folk.push({r:rnd(1,GRID-1),c:rnd(1,GRID-1),gr:rnd(1,GRID-1),gc:rnd(1,GRID-1),col:pick(["#b9c2d4","#cbb18a","#9db5c9","#c9a0a0"])});
  while(folk.length>target) folk.pop();
}
function stepFolk(dt){
  for(const f of folk){
    const dr=f.gr-f.r, dc=f.gc-f.c, d=Math.hypot(dr,dc);
    if(d<0.15){ f.gr=rnd(1,GRID-1); f.gc=rnd(1,GRID-1); }
    else{ f.r+=dr/d*dt*0.7; f.c+=dc/d*dt*0.7; }
  }
}
function drawPerson(r,c,col,emoji){

function renderTown(){
  if(!tctx) return;
  const W=townCv.width/townDpr, H=townCv.height/townDpr;
  tctx.setTransform(townDpr,0,0,townDpr,0,0);
  tctx.imageSmoothingEnabled=false;
  const isLight=document.documentElement.getAttribute("data-theme")==="light";
  tctx.fillStyle=isLight?"#cfe0cf":"#16211a"; tctx.fillRect(0,0,W,H);
  tctx.save();
  tctx.translate(W/2+camX, H*0.5 - GRID*TILE*0.5 + camY);
  // ground
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    const chk=((r+c)&1); drawIsoTile(r,c, chk? (isLight?"#8fbf7f":"#2c4a34") : (isLight?"#9cc98a":"#335a3c"));
  }
  // paths around center
  tctx.globalAlpha=0.5;
  for(let i=0;i<GRID;i++){ drawIsoTile(4,i,"#6b5a3f"); drawIsoTile(i,4,"#6b5a3f"); }
  tctx.globalAlpha=1;

  // collect drawables sorted by depth (r+c)
  const draw=[];
  for(const d of townDecor) draw.push({depth:d.r+d.c-0.5, fn:()=>drawDecor(d)});
  for(const p of townPlaced) draw.push({depth:p.r+p.c+1, fn:()=>drawBuilding(p)});
  for(const f of folk) draw.push({depth:f.r+f.c, fn:()=>drawPerson(f.r,f.c,f.col,null)});
  for(const h of S.hunters){ if(h.state==="idle"||h.state==="resting"){
    const c=CLASSES[h.cls];
    draw.push({depth:h.tx+h.ty, fn:()=>drawHunterSprite(h.tx,h.ty,c)});
  }}
  draw.sort((a,b)=>a.depth-b.depth).forEach(d=>d.fn());
  tctx.restore();
}

/* =========================================================================
   TOWN SIMULATION (living town + tycoon income)
   ========================================================================= */
function buildingIncome(bid){
  const bd=BUILDINGS[bid], st=S.buildings[bid]; if(!st||st.lv<=0) return 0;
  // scales with level and town population/utilisation
  const util = 0.6 + Math.min(1.2, S.town.pop/16) + idleHunters().length*0.05;
  return bd.baseIncome * st.lv * util;
}
function totalIncomePerMin(){ let g=0; for(const b in BUILDINGS) g+=buildingIncome(b); return g*60; }
function idleHunters(){ return S.hunters.filter(h=>h.ai==="TOWN_IDLE"||(h.ai&&h.ai.startsWith("GO_"))); }
function guildCap(){ return 3 + (S.buildings.guild_hall.lv-1)*1 + Math.floor(S.buildings.guild_hall.lv/2) + (S.bonusCap||0); }

function serviceLevel(kind){ // returns 0..n aggregated service strength
  let s=0; for(const b in BUILDINGS){ if(BUILDINGS[b].service===kind){ s+=(S.buildings[b].lv||0); } } return s;
}
function stepTown(dt){
  // income
  S._incAcc=(S._incAcc||0)+dt;
  while(S._incAcc>=BAL.incomeTick){
    S._incAcc-=BAL.incomeTick;
    const g=0; let add=0; for(const b in BUILDINGS) add+=buildingIncome(b);
    S.gold+=add; S.stats.goldEarned+=add;
  }
  // population grows toward capacity from housing (inn) + tavern mood
  const popTarget = 6 + serviceLevel("rest")*3 + (S.buildings.tavern.lv||0)*2 + S.hunters.length;
  S.town.pop += (popTarget - S.town.pop)*0.02*dt;
  ensureFolk(); stepFolk(dt);
  // idle hunters wander & use services (restore needs)
  const healRate = 3 + serviceLevel("heal")*4;
  const enRate = BAL.energyRegen + serviceLevel("energy")*1.5 + serviceLevel("rest")*1.2;
  for(const h of S.hunters){
    if(h.state!=="idle" && h.state!=="resting") continue;
    const mhp=hunterMaxHp(h);
    // wander
    const dr=h.gx-h.tx, dc=h.gy-h.ty, d=Math.hypot(dr,dc);
    if(d<0.2){
      // arrived — pick a building to visit
      const centers=buildingAtCenter();
      if(centers.length){ const t=pick(centers); h.gx=t.r; h.gy=t.c; h.visiting=t.b; h.dwell=rnd(1.5,3.5); }
    } else if(h.dwell>0){ h.dwell-=dt; }
    else { h.tx+=dr/d*dt*0.9; h.ty+=dc/d*dt*0.9; }
    // restore
    if(h.hp<mhp) h.hp=Math.min(mhp,h.hp+healRate*dt);
    if(h.energy<BAL.energyMax) h.energy=Math.min(BAL.energyMax,h.energy+enRate*dt);
    h.state = (h.hp<mhp*0.999||h.energy<BAL.energyMax*0.999) ? "resting":"idle";
  }
}

/* =========================================================================
   FIELD / AUTO-COMBAT
   ========================================================================= */
let activeCombat=null;
function fieldUnlocked(f){ return S.stats.goldEarned>=f.req || f.req===0; }
function dispatch(fieldId, hunterIds){
  const f=fieldById(fieldId);
  for(const id of hunterIds){ const h=S.hunters.find(x=>x.id===id); if(h){ h.state="traveling"; h.field=fieldId; h._travel=rnd(1.5,2.5); } }
}
function recall(fieldId){
  for(const h of S.hunters){ if(h.field===fieldId && h.state!=="idle"){ h.state="returning"; h._travel=1.5; } }
  if(activeCombat && activeCombat.fieldId===fieldId) closeCombat();
}
function huntersInField(fieldId){ return S.hunters.filter(h=>h.field===fieldId && h.state!=="idle" && h.state!=="resting"); }

// A field runs an offscreen abstract loop when not watched; combat overlay renders when watched.
function ensureFieldRun(fieldId){
  if(!S._fields) S._fields={};
  if(!S._fields[fieldId]) S._fields[fieldId]={wave:1, clears:0, mobs:[], hunterHp:{}, tick:0};
  return S._fields[fieldId];
}
function spawnWave(fieldId, run){
  const f=fieldById(fieldId);
  const isBoss = run.clears>0 && run.clears % f.bossEvery===0;
  run.mobs=[];
  if(isBoss){
    const m=MOBS[f.boss]; const sc=1+ (run.clears/ f.bossEvery)*0.4;
    run.mobs.push(mobUnit(f.boss, f.lv+run.clears*0.5, sc, true));
    run.boss=true;
  }else{
    run.boss=false;
    const n=ri(3,5);
    for(let i=0;i<n;i++){ const mid=pick(f.pool); run.mobs.push(mobUnit(mid, f.lv+run.clears*0.4, 1+run.clears*0.05, false)); }
  }
  // position mobs on right
  run.mobs.forEach((m,i)=>{ m.x=0.62+ (i%3)*0.12; m.y=0.3+ Math.floor(i/3)*0.22 + (i%2)*0.06; m.atkT=rnd(0,1); });
}
function mobUnit(mid, lv, scale, boss){
  const m=MOBS[mid]; const k=Math.max(1,lv)/Math.max(1,m.hp>1000?18:5);
  const lvscale=1+(lv-m.hp/40)*0; // keep simple
  const hp=Math.round(m.hp*scale*(1+lv*0.06));
  return {mid, name:m.name, em:m.em, boss:!!boss, ranged:!!m.ranged,
    maxHp:hp, hp, atk:Math.round(m.atk*scale*(1+lv*0.05)), def:m.def, spd:m.spd, xp:m.xp,
    x:0.7,y:0.5, atkT:0, hitFx:0};
}
function combatParty(fieldId){
  const run=ensureFieldRun(fieldId);
  return huntersInField(fieldId).map((h,i)=>{
    const st=hunterStats(h);
    if(run.hunterHp[h.id]==null) run.hunterHp[h.id]=h.hp;
    return {h, st, hp:Math.min(run.hunterHp[h.id],st.hp), maxHp:st.hp, atkT:rnd(0,1),
      x:0.22+ (i%2)*0.09, y:0.32+ Math.floor(i/2)*0.2, hitFx:0, dead:h.hp<=1};
  });
}

// Full simulation step for a field (deterministic-ish real-time). Runs whether watched or not.
function stepField(fieldId, dt){
  const f=fieldById(fieldId);
  const inField=huntersInField(fieldId);
  if(inField.length===0){ return; }
  const run=ensureFieldRun(fieldId);
  if(run.mobs.length===0) spawnWave(fieldId, run);

  // build party view
  const party=combatParty(fieldId);
  const alive=party.filter(p=>!p.dead && p.hp>0);
  if(alive.length===0){ // wipe: send home to heal
    for(const h of inField){ h.state="returning"; h._travel=1.5; h.hp=1; run.hunterHp[h.id]=1; }
    if(activeCombat&&activeCombat.fieldId===fieldId){ logCombat("⚠️ ปาร์ตี้ล้ม! กำลังกลับเมือง"); }
    return;
  }
  const watched = activeCombat && activeCombat.fieldId===fieldId;

  // hunters attack
  for(const p of alive){
    // drain energy
    p.h.energy=Math.max(0,p.h.energy-BAL.energyDrainFight*dt/60*10);
    // class skill (auto-cast on cooldown)
    const sk=SKILLS[p.h.cls];
    if(sk){ if(p.h._skcd==null) p.h._skcd=sk.cd*rnd(0.35,0.75);
      p.h._skcd-=dt;
      if(p.h._skcd<=0){ p.h._skcd=sk.cd; castSkill(sk,p,party,run,fieldId,inField,watched); } }
    p.atkT-=dt;
    if(p.atkT<=0){
      p.atkT=p.st.spd;
      const target=run.mobs.find(m=>m.hp>0); if(!target) break;
      let dmg=Math.max(1, p.st.atk - target.def*0.5);
      const crit=Math.random()<p.st.crit; if(crit) dmg*=p.st.cd;
      dmg*=rnd(0.9,1.1); dmg=Math.round(dmg);
      target.hp-=dmg; target.hitFx=0.25;
      if(watched){ floaty(target.x,target.y,dmg,crit?"#f2c14e":"#fff",crit); }
      if(target.hp<=0){ onMobDeath(fieldId,run,target,inField,watched); }
    }
  }
  // mobs attack
  for(const m of run.mobs){ if(m.hp<=0) continue;
    m.atkT-=dt;
    if(m.atkT<=0){ m.atkT=m.spd;
      const targets=party.filter(p=>p.hp>0);
      // prefer front (vanguard) — highest maxHp
      targets.sort((a,b)=> (b.st.def+b.maxHp*0.02) - (a.st.def+a.maxHp*0.02));
      const t=targets[0]; if(!t) continue;
      let dmg=Math.max(1, m.atk - t.st.def*0.6); dmg*=rnd(0.85,1.15); dmg=Math.round(dmg);
      t.hp-=dmg; t.hitFx=0.25; run.hunterHp[t.h.id]=t.hp; t.h.hp=Math.max(1,t.hp);
      if(watched) floaty(t.x,t.y,dmg,"#e05a5a",false);
      if(t.hp<=0){ t.dead=true; t.h.hp=1; run.hunterHp[t.h.id]=1; if(watched) logCombat(`💀 ${t.h.name} ล้มลง`); }
    }
  }
  // write back hunter hp
  for(const p of party){ run.hunterHp[p.h.id]=Math.max(1,Math.round(p.hp)); p.h.hp=run.hunterHp[p.h.id]; }
  // energy check: if all low energy, return
  if(inField.every(h=>h.energy<=1)){ for(const h of inField){ h.state="returning"; h._travel=1.5; } if(watched) logCombat("😮‍💨 หมดแรง กลับเมือง"); }
}
function dmgMob(target,dmg,fieldId,run,inField,watched,color,big){
  if(target.hp<=0) return;
  dmg=Math.max(1,Math.round(dmg));
  target.hp-=dmg; target.hitFx=0.25;
  if(watched) floaty(target.x,target.y,dmg,color||"#fff",big);
  if(target.hp<=0) onMobDeath(fieldId,run,target,inField,watched);
}
function castSkill(sk,caster,party,run,fieldId,inField,watched){
  const st=caster.st;
  if(watched){ logCombat(`✨ ${caster.h.name} · ${sk.th}`); caster.hitFx=0.15; }
  if(sk.kind==="heal"){
    for(const p of party){ if(p.hp>0){ const amt=Math.round(p.maxHp*sk.pow); p.hp=Math.min(p.maxHp,p.hp+amt);
      if(watched) floaty(p.x,p.y,"+"+amt,"#54c98a"); } }
  } else if(sk.kind==="aoe"){
    for(const m of [...run.mobs]) dmgMob(m, st.atk*sk.pow - m.def*0.5, fieldId,run,inField,watched,sk.col,true);
  } else if(sk.kind==="multi"){
    const targets=run.mobs.filter(m=>m.hp>0).slice(0,sk.hits);
    for(const m of targets) dmgMob(m, st.atk*sk.pow - m.def*0.5, fieldId,run,inField,watched,sk.col,false);
  } else if(sk.kind==="smart"){
    const hurt=party.filter(p=>p.hp>0 && p.hp<p.maxHp*0.6).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
    if(hurt){ const heal=Math.round(st.atk*4); hurt.hp=Math.min(hurt.maxHp,hurt.hp+heal);
      if(watched) floaty(hurt.x,hurt.y,"+"+heal,"#54c98a"); }
    else for(const m of [...run.mobs]) dmgMob(m, st.atk*sk.pow - m.def*0.5, fieldId,run,inField,watched,sk.col,true);
  }
}
function onMobDeath(fieldId,run,mob,inField,watched){
  const f=fieldById(fieldId);
  // rewards
  const gold=ri(f.gold[0],f.gold[1])*(mob.boss?8:1);
  S.gold+=gold; S.stats.goldEarned+=gold;
  for(const h of inField) giveXp(h, Math.round(mob.xp/inField.length)+1);
  S.stats.kills++; run._killGold=(run._killGold||0)+gold;
  inField.forEach(h=>h.kills++);
  if(mob.boss){ S.stats.bossKills++; S.gems+=BAL.gemPerBoss; if(watched) logCombat(`🎉 ล้มบอส ${mob.name}! +💎${BAL.gemPerBoss}`); }
  // loot drop
  let dropChance = mob.boss?1.0:0.22;
  if(Math.random()<dropChance){
    const it=makeItem(f.lv+run.clears, mob.boss?(Math.random()<0.35?"legendary":"epic"):undefined);
    addItem(it);
    if(watched) logCombat(`📦 ได้ ${rarById(it.rarity).name} ${slotById(it.slot).name}`);
  }
  if(watched){ logCombat(`⚔️ ล้ม ${mob.name} +🪙${gold}`); toastUp(`+🪙${gold}`); }
  // wave cleared?
  if(run.mobs.every(m=>m.hp<=0)){
    run.clears++; run.wave++;
    setTimeout(()=>{}, 0);
    spawnWave(fieldId, run);
    if(watched){ logCombat(`— เคลียร์ Wave ${run.wave-1} —`); $("#combatWave").textContent="Wave "+run.wave; }
  }
}
function addItem(it){
  if(S.inv.length>=S.invMax){ // auto-salvage worst common if full
    const worst=S.inv.filter(x=>!x._equipped).sort((a,b)=>itemPower(a)-itemPower(b))[0];
    if(worst){ salvage(worst.id,true); } else return;
  }
  S.inv.push(it); S.seenGear=false; updateBadges();
}

/* travel state machine tick */
function stepTravel(dt){
  for(const h of S.hunters){
    if(h.state==="traveling"){ h._travel-=dt; if(h._travel<=0){ h.state="fighting"; } }
    else if(h.state==="returning"){ h._travel-=dt; if(h._travel<=0){ h.field=null; h.state="idle"; h.gx=h.tx; h.gy=h.ty; h._skcd=null; } }
  }
  // run each active field
  const fields=new Set(S.hunters.filter(h=>h.state==="fighting").map(h=>h.field));
  for(const fid of fields) stepField(fid, dt);
}

let ccv, cctx, cdpr=1, floaties=[];
function initCombatCanvas(){ ccv=$("#combatCv"); cctx=ccv.getContext("2d"); }
function resizeCombat(){ const wrap=$("#combatCanvasWrap"); cdpr=Math.min(2,window.devicePixelRatio||1);
  ccv.width=wrap.clientWidth*cdpr; ccv.height=wrap.clientHeight*cdpr; ccv.style.width=wrap.clientWidth+"px"; ccv.style.height=wrap.clientHeight+"px"; }
function openCombat(fieldId){
  const f=fieldById(fieldId);
  activeCombat={fieldId};
  $("#combat").style.display="flex";
  $("#combatTitle").textContent=f.name;
  $("#combatSub").textContent=huntersInField(fieldId).length+" นักล่า";

}
function closeCombat(){ activeCombat=null; $("#combat").style.display="none"; floaties=[]; }
function logCombat(t){ const el=$("#combatLog"); const d=document.createElement("div"); d.textContent=t; el.appendChild(d);
  while(el.children.length>60) el.removeChild(el.firstChild); el.scrollTop=el.scrollHeight; }
function floaty(x,y,txt,col,big){ floaties.push({x,y,txt:"-"+txt,col,life:0.9,big}); }
function renderCombat(){
  if(!activeCombat||!cctx) return;
  const W=ccv.width/cdpr, H=ccv.height/cdpr;
  cctx.setTransform(cdpr,0,0,cdpr,0,0);
  // bg gradient
  const f=fieldById(activeCombat.fieldId);
  const isLight=document.documentElement.getAttribute("data-theme")==="light";
  const g=cctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, isLight?"#b9d0e0":"#243247"); g.addColorStop(1, isLight?"#8fae86":"#1a2a20");
  cctx.fillStyle=g; cctx.fillRect(0,0,W,H);
  // ground line
  cctx.fillStyle="rgba(0,0,0,.15)"; cctx.fillRect(0,H*0.72,W,H*0.28);
  const run=ensureFieldRun(activeCombat.fieldId);
  const party=combatParty(activeCombat.fieldId);
  // draw hunters
  for(const p of party){ const c=CLASSES[p.h.cls];
    drawFighter(p.x*W,p.y*H+H*0.15, c.emoji, p.hp/p.maxHp, p.hitFx, c.col, p.hp<=0, false, 1, null, tintedSprite(c.sprite,c.tint,0.5), 46);
    p.hitFx=Math.max(0,p.hitFx-0.016); }
  // draw mobs
  for(const m of run.mobs){ if(m.hp<=0) continue; const sz=m.boss?1.7:1;
    const mart=animImg(m.mid);
    drawFighter(m.x*W,m.y*H+H*0.15, m.em, m.hp/m.maxHp, m.hitFx, "#c05050", false, true, sz, m.name, mart, 46*sz*(mart?1.15:1));
    m.hitFx=Math.max(0,m.hitFx-0.016); }
  // floaties
  for(const fl of floaties){ cctx.globalAlpha=clamp(fl.life,0,1); cctx.fillStyle=fl.col; cctx.font=`bold ${fl.big?20:14}px sans-serif`; cctx.textAlign="center";
    cctx.fillText(fl.txt, fl.x*W, fl.y*H+H*0.15 - (0.9-fl.life)*40); fl.life-=0.02; }
  cctx.globalAlpha=1;
  floaties=floaties.filter(f=>f.life>0);
}
function drawFighter(x,y,emoji,hpFrac,hitFx,col,dead,isMob,scale=1,label,sprite,spriteH){
  cctx.save(); cctx.translate(x,y);
  const s=scale;
  // shadow
  cctx.fillStyle="rgba(0,0,0,.25)"; cctx.beginPath(); cctx.ellipse(0,6,16*s,5*s,0,0,7); cctx.fill();
  if(dead){ cctx.globalAlpha=0.35; }
  let topY=-14*s; // where the hp bar sits above
  if(sprite){
    const h=spriteH||46*s; const w=h*((sprite.naturalWidth||sprite.width)/(sprite.naturalHeight||sprite.height));
    if(hitFx>0){ cctx.save(); cctx.globalAlpha=0.5*(dead?0.35:1); cctx.fillStyle="rgba(255,90,90,.55)";
      cctx.beginPath(); cctx.ellipse(0,-h*0.4,w*0.5,h*0.5,0,0,7); cctx.fill(); cctx.restore(); }
    cctx.imageSmoothingEnabled=false;
    cctx.drawImage(sprite, -w/2, -h + h*(isMob?0.06:0.10) + 4, w, h);
    topY=-h*0.98;
  } else {
    if(hitFx>0){ cctx.fillStyle="rgba(255,80,80,.5)"; cctx.beginPath(); cctx.arc(0,-14*s,20*s,0,7); cctx.fill(); }
    cctx.font=`${Math.floor(30*s)}px serif`; cctx.textAlign="center"; cctx.textBaseline="middle";
    cctx.fillText(emoji,0,-14*s);
    topY=-30*s;
  }
  // hp bar
  const bw=Math.max(30,32*s);
  cctx.fillStyle="rgba(0,0,0,.5)"; roundRectC(-bw/2,topY-6,bw,4,2); cctx.fill();
  cctx.fillStyle=isMob?"#e05a5a":"#54c98a"; roundRectC(-bw/2,topY-6,bw*clamp(hpFrac,0,1),4,2); cctx.fill();
  cctx.restore();
  if(label){ cctx.fillStyle="rgba(255,255,255,.7)"; cctx.font="10px sans-serif"; cctx.textAlign="center"; cctx.fillText(label,x,y+16); }
}
function roundRectC(x,y,w,h,r){ cctx.beginPath(); cctx.moveTo(x+r,y); cctx.arcTo(x+w,y,x+w,y+h,r); cctx.arcTo(x+w,y+h,x,y+h,r); cctx.arcTo(x,y+h,x,y,r); cctx.arcTo(x,y,x+w,y,r); cctx.closePath(); }

function zoneCenterX(i){ return GATE_X + 15 + i*ZONE_GAP; }
function worldMaxX(){ return zoneCenterX(FIELDS.length-1) + 16; }

  {x:48,y:2.7,key:"tree_birch",h:1.9},{x:56,y:-2.6,key:"tree_conifer",h:1.9},

];
// camera / projection (reuse townCv,tctx,townDpr,camX,camY)
let TW=26, GY=300, camInit=false, follow=null;
function worldMetrics(){ const W=townCv.width/townDpr, H=townCv.height/townDpr;
  TW=clamp(W/12,16,36); GY=H*0.52; return {W,H}; }
function drawHills(baseY,amp,par,col){ const W=townCv.width/townDpr; tctx.fillStyle=col;
  tctx.beginPath(); tctx.moveTo(0,baseY+amp*2); const off=camX*par;
  for(let x=0;x<=W;x+=16){ const y=baseY - amp*0.5*(1+Math.sin((x-off)/110)); tctx.lineTo(x,y); }
  tctx.lineTo(W,baseY+amp*2); tctx.closePath(); tctx.fill(); }
function screenX(wx){ return camX + wx*TW; }
function screenY(wy){ return GY + wy*(TW*0.62); }
function clampCam(W){ const minX=-(worldMaxX()*TW - W*0.85), maxX=W*0.5 - TOWN_X*TW + 40;
  camX=clamp(camX, Math.min(minX,maxX), maxX); }
function centerOnX(wx){ const W=townCv.width/townDpr; camX = W*0.5 - wx*TW; }
function goHome(){ follow=null; const W=townCv.width/townDpr; camX=W*0.5 - TOWN_X*TW; camY=0; }

// --- helpers ---
function zoneUnlocked(i){ return fieldUnlocked(FIELDS[i]); }
function zonePowerReq(i){ return FIELDS[i].lv*38 + 20; }
function autoZoneFor(h){
  const p=hunterPower(h); let best=0;
  for(let i=0;i<FIELDS.length;i++){ if(zoneUnlocked(i) && p>=zonePowerReq(i)) best=i; }
  // allow one stretch zone if nothing matches beyond 0
  return best;
}
function heroZoneIdx(h){
  if(h.assignedZone==="auto" || h.assignedZone==null) return autoZoneFor(h);
  let i=FIELDS.findIndex(f=>f.id===h.assignedZone);
  if(i<0) i=0; while(i>0 && !zoneUnlocked(i)) i--; return i;
}
function buildingBuilt(bid){ return bid==="guild_hall" || (S.buildings[bid]&&S.buildings[bid].lv>0); }
function serviceSite(kind){ // world pos of best built building for a need (fallback guild_hall)
  let bid=null;
  if(kind==="heal") bid = buildingBuilt("clinic")?"clinic":"guild_hall";
  else if(kind==="rest") bid = buildingBuilt("inn")?"inn":(buildingBuilt("tavern")?"tavern":(buildingBuilt("restaurant")?"restaurant":"guild_hall"));
  else if(kind==="sell") bid = buildingBuilt("market")?"market":"guild_hall";
  else bid="guild_hall";
  return {bid, ...WBUILD[bid]};
}
function moveToward(h,tx,ty,speed,dt){ const dx=tx-h.wx, dy=ty-h.wy, d=Math.hypot(dx,dy);
  if(d<0.3) return true; if(Math.abs(dx)>0.05) h.facing = dx<0?-1:1;
  h.wx+=dx/d*speed*dt; h.wy+=dy/d*speed*dt; return false; }

// --- world combat log + floaties ---
let worldFx=[]; let wlog=[];
function worldFloaty(wx,wy,txt,col,big){ worldFx.push({wx,wy,txt,col,life:0.9,big}); if(worldFx.length>60) worldFx.shift(); }
function worldLog(msg){ wlog.push(msg); if(wlog.length>4) wlog.shift(); const el=$("#worldLog"); if(el) el.innerHTML=wlog.map(m=>`<div>${m}</div>`).join(""); }

// --- monsters as world entities ---
function worldMobUnit(mid, zoneI, boss){
  const f=FIELDS[zoneI]; const lv=f.lv + Math.floor(S.stats.kills/40);
  const scale=1+zoneI*0.15;
  const base=mobUnit(mid, lv, scale*(boss? (2+zoneI*0.5):1), boss);
  base.zone=zoneI; base.wx=zoneCenterX(zoneI)+rnd(-7,7); base.wy=rnd(-2.4,2.4);
  base.gx=base.wx; base.gy=base.wy; base.atkT=rnd(0,base.spd); base.wanderT=rnd(1,3);
  return base;
}
function zoneMobs(i){ return S.world.mobs.filter(m=>m.zone===i && m.hp>0); }
function spawnMonsters(dt){
  if(!S.world) S.world={mobs:[], bossT:{}};
  for(let i=0;i<FIELDS.length;i++){
    if(!zoneUnlocked(i)) continue;
    const cap=4+i;
    const list=zoneMobs(i);
    if(list.length<cap && Math.random()<dt*0.9){
      S.world.mobs.push(worldMobUnit(pick(FIELDS[i].pool), i, false));
    }
    // periodic boss
    S.world.bossT[i]=(S.world.bossT[i]||rnd(40,70))-dt;
    if(S.world.bossT[i]<=0 && !list.some(m=>m.boss)){
      S.world.bossT[i]=rnd(60,110);
      S.world.mobs.push(worldMobUnit(FIELDS[i].boss, i, true));
    }
  }
  // prune far-dead
  S.world.mobs=S.world.mobs.filter(m=>m.hp>0);
}

// --- hero AI ---
function heroLog(h,msg){ /* only surface if near camera-follow or occasionally */ }
function heroAI(h, dt){
  const mhp=hunterMaxHp(h), st=hunterStats(h);
  if(h.hp<=0) h.hp=1;
  switch(h.ai){
    case "TOWN_IDLE": {
      if(h.bag.items.length>0 || h.bag.gold>0){ h.ai="GO_SELL"; }
      else if(h.hp < mhp*0.97){ h.ai="GO_HEAL"; }
      else if(h.energy < BAL.energyMax*0.6){ h.ai="GO_REST"; }
      else { h.ai="WALK_OUT"; h._zone=heroZoneIdx(h); h._skcd=null; }
      break; }
    case "GO_HEAL": { const s=serviceSite("heal");
      if(moveToward(h,s.x,s.y,3.4,dt)){ const rate=8+serviceLevel("heal")*7; h.hp=Math.min(mhp,h.hp+rate*dt);
        payService(s.bid,dt,0.4); if(h.hp>=mhp*0.999){ h.ai="TOWN_IDLE"; } } break; }
    case "GO_REST": { const s=serviceSite("rest");
      if(moveToward(h,s.x,s.y,3.4,dt)){ const rate=7+serviceLevel("rest")*4+serviceLevel("energy")*3; h.energy=Math.min(BAL.energyMax,h.energy+rate*dt);
        payService(s.bid,dt,0.3); if(h.energy>=BAL.energyMax*0.999){ h.ai="TOWN_IDLE"; } } break; }
    case "GO_SELL": { const s=serviceSite("sell");
      if(moveToward(h,s.x,s.y,3.4,dt)){ sellBag(h,s.bid); h.ai="TOWN_IDLE"; } break; }
    case "WALK_OUT": {
      const zc=zoneCenterX(h._zone==null?(h._zone=heroZoneIdx(h)):h._zone);
      if(h.wx < zc-6){ moveToward(h, zc, h.wy||rnd(-2,2), 4.0, dt); }
      else { h.ai="HUNT"; }
      // re-evaluate retreat early if something changed
      break; }
    case "HUNT": {
      // retreat conditions
      if(h.hp<mhp*0.42 || h.energy<=2 || h.bag.items.length>=BAG_CAP){ h.ai="WALK_HOME"; break; }
      h.energy=Math.max(0,h.energy - 2.2*dt);
      const zi=h._zone;
      // skill
      const sk=SKILLS[h.cls];
      if(sk){ if(h._skcd==null) h._skcd=sk.cd*rnd(0.4,0.8); h._skcd-=dt;
        if(h._skcd<=0){ h._skcd=sk.cd; worldSkill(h,st,sk,zi); } }
      // target nearest live mob in zone
      const cands=zoneMobs(zi);
      if(!cands.length){ // nothing here — wander toward center
        moveToward(h, zoneCenterX(zi)+rnd(-4,4), rnd(-2,2), 2.2, dt); break; }
      let tgt=null,bd=1e9; for(const m of cands){ const d=Math.hypot(m.wx-h.wx,m.wy-h.wy); if(d<bd){bd=d;tgt=m;} }
      const range = st.ranged?6:1.3;
      if(bd>range){ moveToward(h,tgt.wx,tgt.wy,2.6,dt); }
      else { h.facing = tgt.wx<h.wx?-1:1;
        h._atkT=(h._atkT||0)-dt;
        if(h._atkT<=0){ h._atkT=st.spd; heroHit(h,st,tgt); } }
      break; }
    case "WALK_HOME": {
      const spd = h.hp<=mhp*0.15?2.2:3.6; // limp if badly hurt
      if(moveToward(h, TOWN_X+rnd(-4,4), rnd(-1.5,1.5), spd, dt)){ h.ai="TOWN_IDLE"; h.dest=null; } break; }
    default: h.ai="TOWN_IDLE";
  }
}
function payService(bid,dt,rate){ // heroes paying for services = tycoon income
  if(bid && BUILDINGS[bid] && BUILDINGS[bid].baseIncome){ const g=BUILDINGS[bid].baseIncome*(S.buildings[bid].lv||1)*rate*dt*4;
    S.gold+=g; S.stats.goldEarned+=g; } }
function sellBag(h,bid){
  const mult = 1 + (buildingBuilt("market")?(S.buildings.market.lv*0.12):-0.4);
  let gold=Math.round(h.bag.gold*Math.max(0.4,mult));
  S.gold+=gold; S.stats.goldEarned+=gold; S.stats.sold=(S.stats.sold||0)+gold;
  for(const it of h.bag.items) addItem(it);
  if(follow===h.id) worldLog(`🪙 ${h.name} ขายของ +${fmt(gold)}${h.bag.items.length?` · เก็บ ${h.bag.items.length} ชิ้น`:""}`);
  h.bag={gold:0,items:[]};
}
function heroHit(h,st,mob){
  let dmg=Math.max(1, st.atk - mob.def*0.5); const crit=Math.random()<st.crit; if(crit) dmg*=st.cd;
  dmg=Math.round(dmg*rnd(0.9,1.1)); mob.hp-=dmg; mob.hitFx=0.22;
  worldFloaty(mob.wx,mob.wy-1.2,"-"+dmg,crit?"#f2c14e":"#fff",crit);
  if(mob.hp<=0) mobDies(mob,h);
}
function worldSkill(h,st,sk,zi){
  const near=zoneMobs(zi).filter(m=>Math.abs(m.wx-h.wx)<8);
  const allies=S.hunters.filter(a=>a.ai==="HUNT" && a._zone===zi && Math.abs(a.wx-h.wx)<8);
  if(follow===h.id) worldLog(`✨ ${h.name} · ${sk.th}`);
  if(sk.kind==="heal"){ for(const a of allies){ const am=hunterMaxHp(a); const v=Math.round(am*sk.pow); a.hp=Math.min(am,a.hp+v); worldFloaty(a.wx,a.wy-1.4,"+"+v,"#54c98a"); } }
  else if(sk.kind==="aoe"){ for(const m of [...near]) hitMobSkill(h,st.atk*sk.pow-m.def*0.5,m,sk.col,true); }
  else if(sk.kind==="multi"){ near.sort((a,b)=>Math.hypot(a.wx-h.wx,a.wy-h.wy)-Math.hypot(b.wx-h.wx,b.wy-h.wy));
    for(const m of near.slice(0,sk.hits)) hitMobSkill(h,st.atk*sk.pow-m.def*0.5,m,sk.col,false); }
  else if(sk.kind==="smart"){ const hurt=allies.filter(a=>a.hp<hunterMaxHp(a)*0.6).sort((a,b)=>a.hp-b.hp)[0];
    if(hurt){ const v=Math.round(st.atk*4); hurt.hp=Math.min(hunterMaxHp(hurt),hurt.hp+v); worldFloaty(hurt.wx,hurt.wy-1.4,"+"+v,"#54c98a"); }
    else for(const m of [...near]) hitMobSkill(h,st.atk*sk.pow-m.def*0.5,m,sk.col,true); }
}
function hitMobSkill(h,dmg,mob,col,big){ if(mob.hp<=0) return; dmg=Math.max(1,Math.round(dmg)); mob.hp-=dmg; mob.hitFx=0.22;
  worldFloaty(mob.wx,mob.wy-1.2,"-"+dmg,col||"#fff",big); if(mob.hp<=0) mobDies(mob,h); }
function mobDies(mob,h){
  const f=FIELDS[mob.zone];
  const gold=ri(f.gold[0],f.gold[1])*(mob.boss?8:1);
  h.bag.gold+=gold; giveXp(h, Math.round(mob.xp/2)+1);
  S.stats.kills++; h.kills++;
  if(mob.boss){ S.stats.bossKills++; S.gems+=BAL.gemPerBoss; if(follow===h.id) worldLog(`🎉 ${h.name} ล้มบอส ${mob.name}! +💎${BAL.gemPerBoss}`); }
  const dropChance=mob.boss?1.0:0.24;
  if(Math.random()<dropChance && h.bag.items.length<BAG_CAP){
    const it=makeItem(f.lv+mob.zone*2, mob.boss?(Math.random()<0.35?"legendary":"epic"):undefined);
    h.bag.items.push(it);
    if(follow===h.id) worldLog(`📦 ${h.name} เก็บ ${rarById(it.rarity).name} ${slotById(it.slot).name}`);

}
function stepWorldMobs(dt){
  for(const m of S.world.mobs){ if(m.hp<=0) continue;
    m.hitFx=Math.max(0,(m.hitFx||0)-dt);
    // find a hero in this zone within aggro
    let tgt=null,bd=1e9;
    for(const h of S.hunters){ if(h.ai!=="HUNT"||h._zone!==m.zone||h.hp<=1) continue;
      const d=Math.hypot(h.wx-m.wx,h.wy-m.wy); if(d<bd){bd=d;tgt=h;} }
    const range=m.ranged?6:1.4;
    if(tgt && bd<=range){ m.atkT-=dt; if(m.atkT<=0){ m.atkT=m.spd;
      const ts=hunterStats(tgt); let dmg=Math.max(1,m.atk-ts.def*0.6); dmg=Math.round(dmg*rnd(0.85,1.15));
      tgt.hp-=dmg; worldFloaty(tgt.wx,tgt.wy-1.4,"-"+dmg,"#e05a5a",false);
      if(tgt.hp<=1){ tgt.hp=1; if(tgt.ai==="HUNT"){ tgt.ai="WALK_HOME"; if(follow===tgt.id) worldLog(`💀 ${tgt.name} เจ็บหนัก กำลังกลับเมือง`); } }
    } }
    else if(tgt && bd<10){ m.facing=tgt.wx<m.wx?-1:1; moveToward2(m,tgt.wx,tgt.wy,m.ranged?1.0:1.6,dt); }
    else { // idle wander in band
      m.wanderT-=dt; if(m.wanderT<=0){ m.wanderT=rnd(2,4); m.gx=zoneCenterX(m.zone)+rnd(-7,7); m.gy=rnd(-2.4,2.4); }
      moveToward2(m,m.gx,m.gy,0.7,dt); }
  }
}
function moveToward2(m,tx,ty,speed,dt){ const dx=tx-m.wx,dy=ty-m.wy,d=Math.hypot(dx,dy); if(d<0.2)return; m.wx+=dx/d*speed*dt; m.wy+=dy/d*speed*dt; }

function incomeTick(dt){
  S._incAcc=(S._incAcc||0)+dt;
  while(S._incAcc>=BAL.incomeTick){ S._incAcc-=BAL.incomeTick; let add=0; for(const b in BUILDINGS) add+=buildingIncome(b);
    S.gold+=add; S.stats.goldEarned+=add; }
}
function popTick(dt){ const popTarget=6+serviceLevel("rest")*3+(S.buildings.tavern.lv||0)*2+S.hunters.length;
  S.town.pop += (popTarget-S.town.pop)*0.02*dt; }

let wfolk=[];
function stepWorld(dt){
  if(!S.world) S.world={mobs:[],bossT:{}};
  incomeTick(dt); popTick(dt);
  spawnMonsters(dt);
  for(const h of S.hunters) heroAI(h,dt);
  stepWorldMobs(dt);
  // townsfolk
  const tgt=Math.min(10,Math.floor(S.town.pop));
  while(wfolk.length<tgt) wfolk.push({wx:TOWN_X+rnd(-8,8),wy:rnd(-2.5,2.5),gx:TOWN_X+rnd(-8,8),gy:rnd(-2.5,2.5),col:pick(["#b9c2d4","#cbb18a","#9db5c9","#c9a0a0"])});
  while(wfolk.length>tgt) wfolk.pop();
  for(const f of wfolk){ const d=Math.hypot(f.gx-f.wx,f.gy-f.wy); if(d<0.3){ f.gx=TOWN_X+rnd(-8,8); f.gy=rnd(-2.5,2.5);} else { f.wx+=(f.gx-f.wx)/d*0.6*dt; f.wy+=(f.gy-f.wy)/d*0.6*dt; } }

}

/* =========================================================================
   GAME LOOP
   ========================================================================= */
let lastFrame=now();
function loop(){
  const t=now(); let dt=(t-lastFrame)/1000; lastFrame=t;
  dt=Math.min(dt,0.1)*(S.settings.speed||1);
  S.playSec+=dt; S.day=1+Math.floor(S.playSec/300);
  stepWorld(dt);
  if(currentView==="town") renderWorld();
  hudTick+=dt; if(hudTick>0.5){ hudTick=0; refreshTopbar(); refreshTownHud(); updateBadges(); if(currentView==="hunters") softRefreshHunters(); }
  queueSave();
  requestAnimationFrame(loop);
}
let hudTick=0;

/* =========================================================================
   OFFLINE CATCH-UP
   ========================================================================= */
function offlineCatchup(){
  const elapsed=Math.min((now()-S.last)/1000, BAL.offlineCapHours*3600);
  if(elapsed<60) return null;
  // passive town income
  let inc=0; for(const b in BUILDINGS) inc+=buildingIncome(b);
  const passiveGold=Math.floor(inc*elapsed*0.85);
  S.gold+=passiveGold; S.stats.goldEarned+=passiveGold;
  // every hunter keeps looping their assigned zone at an averaged rate
  let huntGold=0, xpGain=0, drops=0;
  const active=S.hunters.length;
  for(const h of S.hunters){
    const zi=heroZoneIdx(h); const f=FIELDS[zi]||FIELDS[0];
    const effic=0.55; // travel/rest/sell overhead
    const g=Math.floor(((f.gold[0]+f.gold[1])/2)/2.6 * elapsed * effic); huntGold+=g;
    const xp=Math.floor(elapsed/5*effic); giveXp(h,xp); xpGain+=xp;
    const nd=Math.floor(Math.min(elapsed/240, 20)*effic);
    for(let i=0;i<nd;i++){ if(S.inv.length<S.invMax){ addItem(makeItem(f.lv+zi*2)); drops++; } }
    h.hp=hunterMaxHp(h); h.energy=BAL.energyMax; h.ai="TOWN_IDLE"; h.bag={gold:0,items:[]}; h.wx=TOWN_X+rnd(-5,5);
  }
  S.gold+=huntGold; S.stats.goldEarned+=huntGold;
  return {elapsed, goldGain:passiveGold+huntGold, xpGain, drops, fighters:active};
}

function recruitCost(){ return Math.floor(BAL.recruitBase*Math.pow(BAL.recruitStep, S.hunters.length-2)); }
function doRecruit(){
  const cost=recruitCost(); if(S.gold<cost){ toastUp("🪙 ไม่พอ"); return; }
  if(S.hunters.length>=guildCap()){ toastUp("เต็มแล้ว"); return; }
  S.gold-=cost;
  const lv=Math.max(1, Math.floor(avgHunterLv()*0.7));
  const h=freshHunter(pick(CLASS_IDS), lv); h.hp=hunterMaxHp(h);
  S.hunters.push(h); renderHunters(); refreshTopbar(); toastUp("🎉 รับ "+h.name);
}
function avgHunterLv(){ return S.hunters.reduce((a,h)=>a+h.lv,0)/Math.max(1,S.hunters.length); }

function zoneChipsHtml(h){

function ascendRowHtml(h){

  const nextSm=Math.round(((1+(h.star+1)*0.12)/(1+(h.star||0)*0.12)-1)*100);

    <button class="btn gold" id="btnAscend" ${(!ready||!afford)?"disabled":""}>⭐ เลื่อนดาว</button></div>`;

function openSlotPicker(h, slotId){
  const slot=slotById(slotId);
  const equipped=h.eq[slotId];
  const cands=S.inv.filter(it=>it.slot===slotId && !it._equipped).sort((a,b)=>itemPower(b)-itemPower(a));
  let html=`<div class="small muted" style="margin-bottom:8px">ช่อง: ${slot.ic} ${slot.name}</div>`;
  if(equipped){ html+=`<div class="view-title" style="margin:0 0 6px">ที่สวมอยู่</div>`+itemRow(equipped,h,true); html+=`<div class="divider"></div>`; }
  html+=`<div class="view-title" style="margin:0 0 6px">ในคลัง (${cands.length})</div>`;
  if(!cands.length) html+=`<div class="dim center" style="padding:16px">ไม่มี ${slot.name} ในคลัง</div>`;
  cands.forEach(it=> html+=itemRow(it,h,false));
  openSheet("เลือก "+slot.name, html, true);
  bindItemRows(h);
}
function itemRow(it, h, isEquipped){
  const r=rarById(it.rarity), slot=slotById(it.slot);
  const setTxt=it.set?`<span class="tag" style="color:${SETS[it.set].col};border-color:${SETS[it.set].col}66">${SETS[it.set].th}</span>`:"";
  const subs=it.subs.map(s=>{const d=SUBS.find(x=>x.id===s.id);return `<span class="statmini">${d?d.name:s.id} ${d&&(d.kind!=='flat')?s.v+'%':'+'+s.v}</span>`}).join("");
  return `<div class="gitem" data-item="${it.id}" data-equipped="${isEquipped?1:0}">
    <div class="gicon" style="border-color:${r.col};color:${r.col}">${slot.ic}</div>
    <div class="grow"><div class="row" style="gap:6px"><b style="color:${r.col}">${slot.name}${it.enh>0?" +"+it.enh:""}</b>${setTxt}</div>
      <div class="chipline" style="margin:3px 0 0">${subs||'<span class="dim small">ไม่มีซับสแตท</span>'}</div>
      <div class="dim small">พลัง ${fmt(itemPower(it))} · ${r.name}</div></div>
    <div>${isEquipped?'<button class="btn sec sm" data-act="unequip">ถอด</button>':'<button class="btn sm" data-act="equip">สวม</button>'}</div>
  </div>`;
}
function bindItemRows(h){
  $$("#sheetBody .gitem").forEach(row=>{
    const id=row.dataset.item;
    row.querySelectorAll("[data-act]").forEach(btn=>{
      btn.onclick=(e)=>{ e.stopPropagation();
        const it=findItem(id); if(!it)return;
        if(btn.dataset.act==="equip"){ equipItem(h,it); }
        else if(btn.dataset.act==="unequip"){ unequipItem(h,it); }
        openHunter(h.id);
      };
    });
    row.onclick=()=>openItemDetail(id, h);
  });
}
function findItem(id){ let it=S.inv.find(x=>x.id===id); if(it)return it;
  for(const h of S.hunters) for(const s in h.eq){ if(h.eq[s]&&h.eq[s].id===id) return h.eq[s]; } return null; }
function equipItem(h,it){
  // remove from inv, swap out old
  const old=h.eq[it.slot];
  S.inv=S.inv.filter(x=>x.id!==it.id); it._equipped=true;
  if(old){ old._equipped=false; S.inv.push(old); }
  h.eq[it.slot]=it; h.hp=Math.min(hunterMaxHp(h),h.hp+ (hunterMaxHp(h)-h.hp)*0 ); queueSave();
}
function unequipItem(h,it){ h.eq[it.slot]=null; it._equipped=false; S.inv.push(it); queueSave(); }
function autoEquip(h){
  for(const slot of SLOTS){
    const cands=S.inv.filter(x=>x.slot===slot.id&&!x._equipped);
    const best=cands.sort((a,b)=>itemPower(b)-itemPower(a))[0];
    if(best && (!h.eq[slot.id] || itemPower(best)>itemPower(h.eq[slot.id]))) equipItem(h,best);
  }
}

function openItemDetail(id, hunter){
  const it=findItem(id); if(!it) return;
  const r=rarById(it.rarity), slot=slotById(it.slot);
  const subs=it.subs.map(s=>{const d=SUBS.find(x=>x.id===s.id);return `<div class="row" style="justify-content:space-between"><span class="muted small">${d?d.name:s.id}</span><b>${d&&d.kind!=='flat'?s.v+'%':'+'+s.v}</b></div>`}).join("");
  const eq=it._equipped; const owner=eq?S.hunters.find(h=>Object.values(h.eq).some(e=>e&&e.id===it.id)):null;
  const cost=enhanceCost(it);
  const setInfo=it.set?`<div class="small" style="color:${SETS[it.set].col};margin-top:6px">◈ ${SETS[it.set].name}: ${SETS[it.set].desc}</div>`:"";
  openSheet(`${slot.name} ${it.enh>0?"+"+it.enh:""}`,`
    <div class="row"><div class="gicon" style="width:54px;height:54px;font-size:26px;border-color:${r.col};color:${r.col}">${slot.ic}</div>
      <div class="grow"><b style="color:${r.col};font-size:16px">${r.name} ${slot.name}</b>
        <div class="small muted">พลัง ${fmt(itemPower(it))} · ilvl ${it.ilvl}</div>
        ${eq?`<div class="small" style="color:var(--good)">สวมโดย ${owner?owner.name:'—'}</div>`:''}</div></div>
    <div class="divider"></div>
    <div class="row" style="justify-content:space-between"><span class="muted small">${slot.name==="หมวก"||slot.main==="hp"?"❤️ พลังชีวิต":slot.main==="def"?"🛡️ ป้องกัน":slot.main==="spd"?"⚡ ความเร็ว":slot.main==="crit"?"🎯 คริ":"⚔️ โจมตี"} (หลัก)</span><b>${Math.round(it.mainBase*r.mult*(1+it.enh*0.12))}${slot.main==="crit"||slot.main==="spd"?"%":""}</b></div>
    ${subs}
    ${setInfo}
    <div class="divider"></div>
    <div class="row">
      <button class="btn gold grow" id="btnEnh" ${S.gold<cost?"disabled":""}>⚒️ ตีบวก +${it.enh+1} (🪙${fmt(cost)})</button>
    </div>
    <div class="row" style="margin-top:8px">
      ${eq?'<button class="btn sec grow" id="btnUneq">ถอดออก</button>':`<button class="btn bad grow" id="btnSalv">♻️ หลอม (🪙${fmt(salvageValue(it))})</button>`}
    </div>
  `, true);
  const be=$("#btnEnh"); if(be) be.onclick=()=>{ if(enhance(it)){ openItemDetail(id,hunter);} };
  const bs=$("#btnSalv"); if(bs) bs.onclick=()=>{ salvage(it.id); closeSheet(); if(currentView==="gear")renderGear(); };
  const bu=$("#btnUneq"); if(bu) bu.onclick=()=>{ if(owner){ unequipItem(owner,it); closeSheet(); openHunter(owner.id);} };
}
function enhance(it){
  const cost=enhanceCost(it); if(S.gold<cost){ toastUp("🪙 ไม่พอ"); return false; }
  S.gold-=cost;
  // small fail chance at high enh (softens power)
  const fail = it.enh>=8 && Math.random()<0.25;
  if(fail){ toastUp("💥 ตีบวกไม่สำเร็จ (คืนของ)"); }
  else { it.enh++; toastUp("⚒️ +"+it.enh+" สำเร็จ!"); }
  refreshTopbar(); queueSave(); return true;
}
function salvageValue(it){ const r=rarById(it.rarity); return r.val*10*(1+it.enh*0.5)+it.ilvl*2; }
function salvage(id, silent){ const it=S.inv.find(x=>x.id===id); if(!it||it._equipped) return;
  const v=Math.floor(salvageValue(it)); S.gold+=v; S.inv=S.inv.filter(x=>x.id!==id); if(!silent){ toastUp("♻️ +🪙"+fmt(v)); refreshTopbar(); } queueSave(); }
function salvageJunk(){ // salvage all common/refined not equipped
  const junk=S.inv.filter(x=>!x._equipped && (x.rarity==="common"||x.rarity==="refined"));
  if(!junk.length){ toastUp("ไม่มีของขยะ"); return; }
  let v=0; for(const it of junk){ v+=Math.floor(salvageValue(it)); }
  S.inv=S.inv.filter(x=>!(!x._equipped&&(x.rarity==="common"||x.rarity==="refined")));
  S.gold+=v; toastUp(`♻️ หลอม ${junk.length} ชิ้น +🪙${fmt(v)}`); refreshTopbar(); renderGear(); queueSave();
}

    div.innerHTML=`
      <div class="row"><div class="avatar" style="background:${bd.col}22;border-color:${bd.col}55">${bd.em}</div>
        <div class="grow"><div class="row" style="gap:6px"><b>${bd.name}</b>${built?`<span class="tag">Lv ${lv}</span>`:`<span class="tag">ยังไม่สร้าง</span>`}</div>
          <div class="small muted">${bd.desc}</div></div></div>
      <div class="chipline" style="margin-top:8px">
        ${bd.baseIncome?`<span class="statmini">📈 +${fmt(inc)}/วิ</span>`:""}
        ${extra}
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn ${built?'gold':''} grow" data-up="${bid}" ${S.gold<cost?"disabled":""}>
          ${built?`⬆️ อัพเกรด Lv${lv+1}`:`🏗️ สร้าง`} · 🪙${fmt(cost)}</button>
      </div>`;
    wrap.appendChild(div);
  }
  wrap.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>upgradeBuilding(b.dataset.up));
}
function serviceName(s){ return {energy:"อาหาร",heal:"รักษา",rest:"พักผ่อน",forge:"ตีเหล็ก",shop:"ตลาด",mood:"ขวัญ"}[s]||s; }
function upgradeBuilding(bid){
  const cost=buildCost(bid); if(S.gold<cost){ toastUp("🪙 ไม่พอ"); return; }
  S.gold-=cost; S.buildings[bid].lv++; layoutTown();
  toastUp("🏗️ "+BUILDINGS[bid].name+" Lv"+S.buildings[bid].lv);
  refreshTopbar(); renderShop();
}

/* ---- Building tap from town ---- */
function openBuilding(bid){
  const bd=BUILDINGS[bid], st=S.buildings[bid], cost=buildCost(bid);
  let body=`<div class="row"><div class="avatar" style="width:52px;height:52px;font-size:26px;background:${bd.col}22;border-color:${bd.col}55">${bd.em}</div>
    <div class="grow"><b>${bd.name}</b> <span class="tag">Lv ${st.lv}</span><div class="small muted">${bd.desc}</div></div></div>
    <div class="chipline" style="margin-top:8px">${bd.baseIncome?`<span class="statmini">📈 +${fmt(buildingIncome(bid))}/วิ</span>`:""}
    ${bd.service?`<span class="statmini">บริการ ${serviceName(bd.service)}</span>`:""}
    ${bid==="guild_hall"?`<span class="statmini">ช่องนักล่า ${guildCap()}</span>`:""}</div>
    <div class="divider"></div>
    <button class="btn gold" style="width:100%" id="btnBQuick" ${S.gold<cost?"disabled":""}>⬆️ อัพเกรด Lv${st.lv+1} · 🪙${fmt(cost)}</button>`;
  openSheet(bd.name, body, true);
  $("#btnBQuick").onclick=()=>{ upgradeBuilding(bid); openBuilding(bid); };
}

/* =========================================================================
   SHEET / TOASTS / SETTINGS
   ========================================================================= */
function openSheet(title, html, center){
  $("#sheetTitle").textContent=title; $("#sheetBody").innerHTML=html;
  $("#sheet").className=center?"center":""; $("#sheet").style.display="block";
}
function closeSheet(){ $("#sheet").style.display="none"; }
let toastT=0;
function toastUp(txt){ const el=$("#toastup"); el.textContent=txt; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1400); }

/* ---- Quests ---- */
function openQuests(){
  let html=`<div class="muted small" style="margin-bottom:8px">ทำสำเร็จเพื่อรับรางวัล — เป้าหมายไต่ระดับเรื่อยๆ</div>`;
  for(const q of QUESTS){
    const c=questClaimed(q), done=c>=q.tiers.length;
    const cur=q.stat();
    const target=done?q.tiers[q.tiers.length-1]:q.tiers[c];
    const prevT=c>0?q.tiers[c-1]:0;
    const frac=done?1:clamp((cur-prevT)/(target-prevT),0,1);
    const claimable=questClaimable(q);
    const rew=done?null:q.rew(c);
    const rewTxt=rew?(rew.gold?`🪙${fmt(rew.gold)}`:`💎${rew.gems}`):"";
    html+=`<div class="card" style="padding:11px">
      <div class="row" style="gap:8px"><div class="gicon" style="font-size:19px">${q.ic}</div>
        <div class="grow"><div class="row" style="gap:6px"><b>${q.name}</b><span class="tag">ระดับ ${Math.min(c+1,q.tiers.length)}/${q.tiers.length}</span></div>
          <div class="dim small">${done?"สำเร็จครบทุกระดับ 🎉":`${fmt(cur)} / ${fmt(target)}`}</div></div>
        ${claimable?`<button class="btn good sm" data-quest="${q.id}">รับ ${rewTxt}</button>`:done?`<span class="tag">✓</span>`:`<span class="statmini">${rewTxt}</span>`}
      </div>
      <div class="bar" style="margin-top:8px"><i style="width:${frac*100}%;background:${claimable?'var(--good)':'var(--accent)'}"></i></div>
    </div>`;
  }
  openSheet("ภารกิจ", html, true);
  $$("#sheetBody [data-quest]").forEach(b=>b.onclick=()=>{ claimQuest(b.dataset.quest); openQuests(); });
}
function claimQuest(id){
  const q=QUESTS.find(x=>x.id===id); if(!q||!questClaimable(q)) return;
  const c=questClaimed(q); const rew=q.rew(c);
  if(rew.gold){ S.gold+=rew.gold; S.stats.goldEarned+=rew.gold; toastUp("🎯 +🪙"+fmt(rew.gold)); }
  if(rew.gems){ S.gems+=rew.gems; toastUp("🎯 +💎"+rew.gems); }
  S.quests[id]=c+1; refreshTopbar(); updateBadges(); queueSave();
}

/* ---- Gem shop (spend boss gems) ---- */
function gemDeals(){
  const inc=Math.max(1200, Math.round(totalIncomePerMin()*20));
  return [
    {id:"gold", ic:"🪙", name:"ถุงทอง", desc:`ทองก้อนโต +${fmt(inc)}`, cost:5, act:()=>{ S.gold+=inc; S.stats.goldEarned+=inc; }},
    {id:"cache", ic:"📦", name:"หีบสมบัติ", desc:"อุปกรณ์ระดับสูง 3 ชิ้น (Epic ขึ้นไป)", cost:12, act:()=>{
      const il=Math.round(6+ (S.stats.bossKills*1.5) + avgHunterLv());
      for(let i=0;i<3;i++) addItem(makeItem(il, Math.random()<0.25?"legendary":Math.random()<0.5?"ancient":"epic")); }},
    {id:"rest", ic:"💤", name:"พักฟื้นทันที", desc:"ฟื้น HP+เรี่ยวแรงนักล่าทุกคนเต็ม", cost:3, act:()=>{
      S.hunters.forEach(h=>{ h.hp=hunterMaxHp(h); h.energy=BAL.energyMax; }); }},
    {id:"cap", ic:"🏕️", name:"ขยายสมาคม", desc:"+1 ช่องนักล่าถาวร", cost:30, act:()=>{ S.bonusCap=(S.bonusCap||0)+1; }},
  ];
}
function openGemShop(){
  const deals=gemDeals();
  let html=`<div class="row" style="justify-content:space-between;margin-bottom:8px">
    <span class="muted small">เพชรได้จากการล้มบอสในพื้นที่ล่า</span><b class="gem" style="color:var(--gem)">💎 ${fmt(S.gems)}</b></div>`;
  for(const d of deals){
    html+=`<div class="gitem"><div class="gicon" style="font-size:20px;border-color:var(--gem)">${d.ic}</div>
      <div class="grow"><b>${d.name}</b><div class="dim small">${d.desc}</div></div>
      <button class="btn sm" data-gem="${d.id}" ${S.gems<d.cost?"disabled":""}>💎 ${d.cost}</button></div>`;
  }
  openSheet("ร้านเพชร", html, true);
  $$("#sheetBody [data-gem]").forEach(b=>b.onclick=()=>{
    const d=deals.find(x=>x.id===b.dataset.gem); if(!d||S.gems<d.cost) return;
    S.gems-=d.cost; d.act(); refreshTopbar(); toastUp(d.ic+" "+d.name); openGemShop();
    if(currentView==="hunters") renderHunters(); if(currentView==="gear") renderGear();
  });
}
function openSettings(){
  openSheet("ตั้งค่า", `
    <div class="row" style="justify-content:space-between"><span>ธีม</span>
      <select id="setTheme"><option value="dark">มืด</option><option value="light">สว่าง</option></select></div>
    <div class="row" style="justify-content:space-between;margin-top:10px"><span>ความเร็วเกม</span>
      <select id="setSpeed"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option></select></div>
    <div class="divider"></div>
    <div class="small muted">Day ${S.day} · เล่นมา ${Math.floor(S.playSec/60)} นาที · ล้ม ${fmt(S.stats.kills)} · บอส ${S.stats.bossKills}</div>
    <div class="divider"></div>
    <button class="btn bad" style="width:100%" id="btnReset">🗑️ เริ่มเกมใหม่ (ลบเซฟ)</button>
  `, true);
  const th=$("#setTheme"); th.value=S.settings.theme; th.onchange=()=>{ S.settings.theme=th.value; applyTheme(); save(); };
  const sp=$("#setSpeed"); sp.value=String(S.settings.speed||1); sp.onchange=()=>{ S.settings.speed=+sp.value; save(); };
  $("#btnReset").onclick=()=>{ if(confirm("ลบเซฟและเริ่มใหม่?")){ localStorage.removeItem(SAVE_KEY); location.reload(); } };
}
function applyTheme(){ document.documentElement.setAttribute("data-theme", S.settings.theme==="light"?"light":"dark"); }
function toggleFullscreen(){ try{
  if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement); }
  else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
}catch(e){} }

/* =========================================================================
   BOOT
   ========================================================================= */
function bindNav(){
  $$("#nav button").forEach(b=>b.onclick=()=>showView(b.dataset.view));
  $("#btnSettings").onclick=openSettings;
  $("#gemChip").onclick=openGemShop;
  $("#btnQuests").onclick=openQuests;
  $("#sheetClose").onclick=closeSheet;
  $("#sheet .backdrop").onclick=closeSheet;
  $("#pillBuild").onclick=()=>showView("shop");
  $("#pillIncome").onclick=()=>showView("shop");
  $("#pillHome").onclick=()=>{ goHome(); };
  $("#btnFull").onclick=toggleFullscreen;
  document.addEventListener("fullscreenchange", ()=>{ setTimeout(resizeTown,60); });
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(); });
}
function boot(){
  const had=load();
  if(!had) newGame();
  applyTheme();
  loadArt();
  initTown(); bindNav();
  refreshTopbar(); refreshTownHud(); updateBadges();
  // offline
  const off= had ? offlineCatchup() : null;
  if(off){ showOfflineModal(off); }
  lastFrame=now();
  requestAnimationFrame(loop);
}
function showOfflineModal(off){
  const mins=Math.floor(off.elapsed/60);
  openSheet("ยินดีต้อนรับกลับ 👋", `
    <div class="center" style="padding:6px 0">
      <div style="font-size:38px">🏘️</div>
      <div class="muted small">คุณไม่อยู่ ${mins>=60?Math.floor(mins/60)+" ชม. ":""}${mins%60} นาที</div>
    </div>
    <div class="card" style="margin-top:6px">
      <div class="row" style="justify-content:space-between"><span>🪙 รายได้เมือง + ล่า</span><b class="gold" style="color:var(--gold)">+${fmt(off.goldGain)}</b></div>
      ${off.fighters?`<div class="row" style="justify-content:space-between"><span>🛡️ นักล่าออกล่า</span><b>${off.fighters} คน</b></div>`:""}
      ${off.xpGain?`<div class="row" style="justify-content:space-between"><span>⭐ XP รวม</span><b>+${fmt(off.xpGain)}</b></div>`:""}
      ${off.drops?`<div class="row" style="justify-content:space-between"><span>📦 ของที่เก็บได้</span><b>${off.drops} ชิ้น</b></div>`:""}
    </div>
    <button class="btn good" style="width:100%" onclick="document.getElementById('sheet').style.display='none'">รับรางวัล</button>
  `, true);
  refreshTopbar();
}
boot();
</script>
</body>
